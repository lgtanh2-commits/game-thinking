<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chương {N}: {Tên chương} — {Tên sách}</title>
<link rel="stylesheet" href="../assets/theme.css">
<!-- Chỉ thêm <style> riêng ở đây nếu sách của bạn cần thành phần đặc thù
     (card/diagram/box minh hoạ) — KHÔNG định nghĩa lại token màu/font đã có
     trong assets/theme.css. -->
</head>
<body>

<!-- Sửa {slug-sach} = đúng slug trong meta.json của sách này -->
<p class="book-topline"><a href="/{slug-sach}">← Về mục lục</a></p>

<div class="book-label">{Tên sách} · {Tác giả} · Chương {N}</div>
<h1>{Tên chương}</h1>
<p class="chapter-subtitle">{Phụ đề / tóm tắt ngắn 1 dòng — có thể để trống nếu không cần}</p>

<!-- ═══════ Nội dung chương — viết tự do từ đây, giữ nguyên phần nav trên/dưới ═══════ -->

<h2>{Tiêu đề mục 1}</h2>
<p>{Nội dung...}</p>

<hr class="divider">

<h2>{Tiêu đề mục 2}</h2>
<p>{Nội dung...}</p>

<!-- ═══════════════════════════════════════════════════════════════════════════ -->

<!-- BẮT BUỘC: nav chương trước/sau. Chương đầu tiên của sách thì bỏ link "Chương trước",
     chương cuối thì bỏ link "Chương sau" (xem ví dụ thật trong bất kỳ sách nào khác trong Books/).
     href dùng URL sạch /{slug-sách}/{slug-chương} (khớp field "slug" của chương đó
     trong meta.json) — KHÔNG dùng tên file, KHÔNG kèm đuôi .html. -->
<nav class="chapnav">
  <a href="/{slug-sach}/{slug-chuong-truoc}"><span class="lbl">Chương trước</span>Chương {N-1}: {Tên chương trước}</a>
  <a href="/{slug-sach}/{slug-chuong-sau}"><span class="lbl">Chương sau</span>Chương {N+1}: {Tên chương sau}</a>
</nav>

</body>
</html>
