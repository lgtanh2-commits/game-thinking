name: Regenerate manifest

on:
  push:
    branches: [main]
    paths:
      - '**/meta.json'
      - '!manifest.json'

permissions:
  contents: write

concurrency:
  group: regenerate-manifest
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate manifest.json
        run: node scripts/generate-manifest.mjs

      - name: Commit + push if changed
        run: |
          if git diff --quiet -- manifest.json; then
            echo "manifest.json không đổi — bỏ qua commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: regenerate manifest.json [skip ci]"

          # Retry ngắn nếu có commit khác vừa push xen giữa lúc job này chạy.
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push thất bại (lần $i), thử pull --rebase rồi push lại..."
            git pull --rebase origin main
          done
          echo "Push thất bại sau 3 lần thử." >&2
          exit 1
