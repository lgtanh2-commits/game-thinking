<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tổng hợp insight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Designmodo-style tokens — xem DESIGN (1).md */
      --color-forest-floor: #0e231c;
      --color-canopy-shadow: #1a3029;
      --color-pine-border: #233630;
      --color-slate-ink: #313942;
      --color-ash: #656a75;
      --color-mist: #c3cecb;
      --color-fog: #879b93;
      --color-parchment: #f4f7f2;
      --color-dew: #e4ebe2;
      --color-sprout: #27ae60;
      --color-sprout-dark: #1e8e4e;
      --color-sage-whisper: #defaca;

      --font-main: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      --radius-buttons: 999px;
      --radius-cards: 32px;
      --radius-chapter-row: 16px;
      --radius-badges: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-main);
      background: var(--color-parchment);
      color: var(--color-slate-ink);
      -webkit-font-feature-settings: "cv03", "cv04", "cv06", "cv09", "ss03";
      font-feature-settings: "cv03", "cv04", "cv06", "cv09", "ss03";
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ── NAV ── */
    nav.topnav {
      background: var(--color-forest-floor);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    nav.topnav .brand {
      color: #ffffff;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    nav.topnav .crumb {
      color: var(--color-fog);
      font-size: 14px;
      font-weight: 400;
    }

    nav.topnav .crumb b {
      color: #ffffff;
      font-weight: 600;
    }

    /* ── HERO (dark) ── */
    .hero {
      background: var(--color-forest-floor);
      padding: 64px 32px 80px;
    }

    .hero-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    .hero h1 {
      color: #ffffff;
      font-size: 48px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -1.06px;
    }

    .hero h1 .accent {
      color: var(--color-sage-whisper);
    }

    .hero .lead {
      color: var(--color-fog);
      font-size: 16px;
      line-height: 1.6;
      margin-top: 12px;
      max-width: 560px;
    }

    .search-wrap {
      margin-top: 32px;
      max-width: 420px;
    }

    .search-input {
      width: 100%;
      background: var(--color-canopy-shadow);
      border: 1px solid var(--color-pine-border);
      color: #ffffff;
      font-family: var(--font-main);
      font-size: 15px;
      padding: 13px 20px;
      border-radius: var(--radius-buttons);
      outline: none;
      transition: border-color .15s ease;
    }

    .search-input::placeholder {
      color: var(--color-fog);
    }

    .search-input:focus {
      border-color: var(--color-sprout);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, .35);
      color: #ffffff;
      border-radius: var(--radius-buttons);
      padding: 7px 19px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 24px;
    }

    .back-btn:hover {
      border-color: #ffffff;
    }

    .book-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      background: var(--color-canopy-shadow);
      color: var(--color-fog);
      border: 1px solid var(--color-pine-border);
      border-radius: var(--radius-chapter-row);
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
    }

    .chip.count {
      color: #ffffff;
      background: rgba(39, 174, 96, .18);
      border-color: rgba(39, 174, 96, .4);
    }

    /* Category Badge / Status Badge — nền riêng, tự tương phản tốt dù đặt trên nền tối (hero) hay sáng (book-row) */
    .category-badge,
    .status-badge {
      display: inline-flex;
      align-items: center;
      border-radius: var(--radius-badges);
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .02em;
    }

    .category-badge {
      background: var(--color-sage-whisper);
      color: var(--color-sprout-dark);
    }

    .status-badge {
      background: var(--color-sprout);
      color: #ffffff;
    }

    /* ── CONTENT (light) ── */
    .content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 32px 96px;
    }

    /* Book list — thay cho grid cũ, mỗi sách 1 hàng để dễ quét mắt hơn khi danh sách dài */
    .book-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: -32px;
    }

    .book-row {
      background: #ffffff;
      border: 1px solid var(--color-dew);
      border-radius: var(--radius-chapter-row);
      padding: 22px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      transition: border-color .15s ease, transform .15s ease;
    }

    .book-row:hover {
      border-color: var(--color-sprout);
      transform: translateY(-1px);
    }

    .book-row-main {
      min-width: 0;
      flex: 1 1 auto;
    }

    .book-row-top {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .book-row h2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.2px;
      line-height: 1.3;
    }

    .book-row-author {
      color: var(--color-ash);
      font-size: 14px;
      margin-top: 4px;
    }

    /* Primary CTA Button — theo đúng component DESIGN.md: nền sprout, chữ trắng, pill, mũi tên */
    .primary-cta {
      flex: none;
      background: var(--color-sprout);
      color: #ffffff;
      border-radius: var(--radius-buttons);
      padding: 13px 28px;
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
    }

    .book-row:hover .primary-cta {
      background: var(--color-sprout-dark);
    }

    .empty-state {
      text-align: center;
      color: var(--color-ash);
      padding: 48px 0;
      font-size: 15px;
    }

    /* Pagination */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 36px;
      flex-wrap: wrap;
    }

    .page-btn {
      min-width: 40px;
      height: 40px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-buttons);
      border: 1px solid var(--color-dew);
      background: #ffffff;
      color: var(--color-slate-ink);
      font-family: var(--font-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, color .15s ease;
    }

    .page-btn:hover:not(:disabled):not(.active) {
      border-color: var(--color-sprout);
    }

    .page-btn.active {
      background: var(--color-sprout);
      border-color: var(--color-sprout);
      color: #ffffff;
    }

    .page-btn:disabled {
      opacity: .35;
      cursor: default;
    }

    /* Chapter list */
    .chapter-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: -32px;
    }

    .chapter-row {
      background: #ffffff;
      border: 1px solid var(--color-dew);
      border-radius: var(--radius-chapter-row);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .chapter-num {
      flex: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--color-sprout);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }

    .chapter-text {
      flex: 1 1 auto;
      min-width: 0;
    }

    .chapter-text h3 {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
    }

    .chapter-text .sub {
      color: var(--color-ash);
      font-size: 13px;
      margin-top: 2px;
    }

    .read-btn {
      flex: none;
      background: var(--color-sprout);
      color: #ffffff;
      border-radius: var(--radius-buttons);
      padding: 9px 20px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    .read-btn:hover {
      background: var(--color-sprout-dark);
    }

    @media (max-width: 560px) {
      .hero {
        padding: 48px 20px 64px;
      }

      .hero h1 {
        font-size: 32px;
        letter-spacing: -0.48px;
      }

      .content {
        padding: 40px 20px 64px;
      }

      .chapter-row {
        flex-wrap: wrap;
      }

      .read-btn {
        margin-left: 54px;
      }

      .book-row {
        flex-direction: column;
        align-items: flex-start;
        padding: 20px;
      }

      .book-row .primary-cta {
        align-self: stretch;
        text-align: center;
      }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

    const bookGrid = document.getElementById('book-grid');
    const pagination = document.getElementById('pagination');
    const searchInput = document.getElementById('search-input');
    const viewLibrary = document.getElementById('view-library');
    const viewDetail = document.getElementById('view-detail');
    const crumb = document.getElementById('crumb');

    const PAGE_SIZE = 20;
    let searchQuery = '';
    let currentPage = 1;

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderBookList() {
      const q = searchQuery.trim().toLowerCase();
      const filtered = LIBRARY.filter(b => b.title.toLowerCase().includes(q));

      if (filtered.length === 0) {
        bookGrid.innerHTML = `<div class="empty-state">Không tìm thấy sách nào khớp với "${escapeHtml(searchQuery)}".</div>`;
        pagination.innerHTML = '';
        return;
      }

      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      const start = (currentPage - 1) * PAGE_SIZE;
      const pageBooks = filtered.slice(start, start + PAGE_SIZE);

      bookGrid.innerHTML = pageBooks.map(b => `
    <a class="book-row" href="#/book/${b.slug}">
      <div class="book-row-main">
        <div class="book-row-top">
          <span class="category-badge">${escapeHtml(b.tag)}</span>
          <span class="status-badge">${b.chapters.length} chương</span>
        </div>
        <h2>${escapeHtml(b.title)}</h2>
        <div class="book-row-author">${escapeHtml(b.author)}</div>
      </div>
      <span class="primary-cta">Xem mục lục →</span>
    </a>
  `).join('');

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
      }
      let html = `<button class="page-btn" data-page="${currentPage - 1}" ${currentPage === 1 ? 'disabled' : ''} aria-label="Trang trước">←</button>`;
      for (let p = 1; p <= totalPages; p++) {
        html += `<button class="page-btn${p === currentPage ? ' active' : ''}" data-page="${p}">${p}</button>`;
      }
      html += `<button class="page-btn" data-page="${currentPage + 1}" ${currentPage === totalPages ? 'disabled' : ''} aria-label="Trang sau">→</button>`;
      pagination.innerHTML = html;
    }

    pagination.addEventListener('click', (e) => {
      const btn = e.target.closest('.page-btn');
      if (!btn || btn.disabled) return;
      currentPage = parseInt(btn.dataset.page, 10);
      renderBookList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    function renderDetail(slug) {
      const book = LIBRARY.find(b => b.slug === slug);
      if (!book) {
        location.hash = '#/';
        return;
      }

      document.getElementById('detail-title').textContent = book.title;
      document.getElementById('detail-author').textContent = book.author;
      document.getElementById('detail-meta').innerHTML = `
    <span class="category-badge">${escapeHtml(book.tag)}</span>
    <span class="status-badge">${book.chapters.length} chương</span>
  `;

      const list = document.getElementById('chapter-list');
      list.innerHTML = book.chapters.map(ch => `
    <div class="chapter-row">
      <div class="chapter-num">${ch.n}</div>
      <div class="chapter-text">
        <h3>${escapeHtml(ch.title)}</h3>
        ${ch.sub ? `<div class="sub">${escapeHtml(ch.sub)}</div>` : ''}
      </div>
      <a class="read-btn" href="${encodeURI(ch.file)}">Đọc →</a>
    </div>
  `).join('');

      crumb.innerHTML = `/ <b>${escapeHtml(book.title)}</b>`;
    }

    function render() {
      const hash = location.hash || '#/';
      const bookMatch = hash.match(/^#\/book\/(.+)$/);

      if (bookMatch) {
        viewLibrary.classList.add('hidden');
        viewDetail.classList.remove('hidden');
        renderDetail(decodeURIComponent(bookMatch[1]));
      } else {
        viewDetail.classList.add('hidden');
        viewLibrary.classList.remove('hidden');
        crumb.innerHTML = '';
        searchInput.value = searchQuery;
        renderBookList();
      }
      window.scrollTo(0, 0);
    }

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      currentPage = 1;
      renderBookList();
    });

    window.addEventListener('hashchange', render);
    render();
  </script>

</body>

</html>
